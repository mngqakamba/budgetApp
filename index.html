<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Guide">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Money Guide</title>
<style>
:root{--bg:#F2F4F5;--card:#fff;--ink:#15212B;--mute:#5E6B76;--line:#DDE2E6;--acc:#0E4F5C;--onacc:#fff;--ok:#2E7D52;--warn:#A86A10;--bad:#B23A2B;--track:#E4E9EC}
@media(prefers-color-scheme:dark){:root{--bg:#10181E;--card:#18232B;--ink:#E8EEF2;--mute:#93A1AC;--line:#26343E;--acc:#6FC1CF;--onacc:#0B1A20;--ok:#6CC28F;--warn:#E0A74A;--bad:#E8806F;--track:#26343E}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0)}
#app{max-width:560px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header button{background:none;border:0;color:var(--acc);font-size:26px;padding:4px 14px;cursor:pointer}
header h1{font-size:17px;margin:0;font-weight:600}
.big{font:400 52px/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:2px 0 2px}
.mute{color:var(--mute);font-size:14px}
.hero{padding:10px 0 18px}
.bar{position:relative;height:10px;background:var(--track);border-radius:5px;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--acc)}
.bar.over i{background:var(--bad)}
.bar b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.55}
.note{background:var(--card);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin:0 0 16px;font-size:14px}
.note button{margin-top:6px}
h2{font-size:15px;margin:20px 0 6px;display:flex;justify-content:space-between;font-weight:600}
h2 span{font-weight:400;color:var(--mute);font-size:13px}
.row{background:var(--card);padding:10px 12px;border-bottom:1px solid var(--line)}
.row:first-of-type{border-radius:8px 8px 0 0}.row:last-of-type{border-radius:0 0 8px 8px;border-bottom:0}.row:only-of-type{border-radius:8px}
.row .top{display:flex;justify-content:space-between;gap:8px}
.row .bar{height:6px;margin:6px 0 0}
.over-t{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.amt{font-size:32px;font-family:Georgia,serif;padding:14px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:14px;font-weight:600;font-size:16px;font-family:inherit;width:100%;margin-top:18px;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc);margin-top:10px}
.sm{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;font-family:inherit;padding:4px 0;cursor:pointer}
.sm.d{color:var(--bad)}
.edit{display:flex;align-items:center;gap:8px}
.edit span{flex:1}.edit input{width:110px;text-align:right;padding:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:12px 0;font:inherit;font-size:13px;cursor:pointer}
nav button[aria-current=true]{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
const SEED=[{"g": "Housing", "n": "Home Loan/Rent", "p": 3700.0}, {"g": "Housing", "n": "Electricity", "p": 800.0}, {"g": "Housing", "n": "Telkom", "p": 418.0}, {"g": "Housing", "n": "Rain", "p": 625.0}, {"g": "Housing", "n": "MetLife", "p": 73.35}, {"g": "Housing", "n": "Old Mutual", "p": 445.2}, {"g": "Housing", "n": "Old Mutual 2", "p": 55.65}, {"g": "Transportation", "n": "Bus/train/taxi fare", "p": 4000.0}, {"g": "Insurance", "n": "Funeral Cover", "p": 1256.0}, {"g": "Insurance", "n": "Clientelle Life", "p": 367.0}, {"g": "Insurance", "n": "Old Mutual", "p": 364.0}, {"g": "Food", "n": "Groceries", "p": 5000.0}, {"g": "Food", "n": "Dining out", "p": 1000.0}, {"g": "Personal Care", "n": "Hair/nails", "p": 400.0}, {"g": "Children", "n": "Soneike PS", "p": 2550.0}, {"g": "Children", "n": "Aquafun Swimming", "p": 1800.0}, {"g": "Children", "n": "Best College", "p": 1300.0}, {"g": "Savings & Investments", "n": "Luphiwe Investment", "p": 1000.0}, {"g": "Savings & Investments", "n": "Masonge B2S", "p": 1200.0}, {"g": "Savings & Investments", "n": "Mgalelo", "p": 12000.0}, {"g": "Savings & Investments", "n": "Boxer Card", "p": 10000.0}, {"g": "Legal", "n": "Scorpion Legal", "p": 144.0}, {"g": "Savings & Investments", "n": "Emergency fund", "p": 0}, {"g": "Savings & Investments", "n": "Retirement account", "p": 0}];
const KEY='moneyguide.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>(n<0?'-':'')+'R'+Math.abs(n).toLocaleString('en-ZA',{maximumFractionDigits:2});
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S=load(),M=ym(new Date()),tab='home';
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.cats)return j}catch(e){}
 return{income:49970,inc:{},ov:{},tx:[],n:1,cats:SEED.map((c,i)=>({id:'c'+i,g:c.g,n:c.n,p:c.p}))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const plan=c=>S.ov[M]&&S.ov[M][c.id]!==undefined?S.ov[M][c.id]:c.p;
const income=()=>S.inc[M]!==undefined?S.inc[M]:S.income;
const txs=()=>S.tx.filter(t=>t.d.startsWith(M));
const spent=id=>txs().filter(t=>t.c===id).reduce((a,t)=>a+t.a,0);
const groups=()=>{const g={};S.cats.forEach(c=>(g[c.g]=g[c.g]||[]).push(c));return g};
const label=()=>{const[y,m]=M.split('-');return new Date(y,m-1).toLocaleString('en-ZA',{month:'long',year:'numeric'})};
function shift(n){const[y,m]=M.split('-').map(Number);M=ym(new Date(y,m-1+n,1));render()}
function go(t){tab=t;render();scrollTo(0,0)}
function head(){return`<header><button onclick="shift(-1)" aria-label="Previous month">‹</button><h1>${label()}</h1><button onclick="shift(1)" aria-label="Next month">›</button></header>`}
function home(){
 const inc=income(),sp=txs().reduce((a,t)=>a+t.a,0),pl=S.cats.reduce((a,c)=>a+plan(c),0),left=inc-sp,un=inc-pl;
 const now=new Date(),cur=ym(now)===M,dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 const pct=pl>0?Math.min(100,sp/pl*100):0,tick=cur?now.getDate()/dim*100:null;
 let h=head()+`<div class="hero"><div class="mute">Left to spend</div><div class="big ${left<0?'over-t':''}">${R(left)}</div>
 <div class="mute">${R(sp)} spent or set aside, from ${R(inc)} income</div>
 <div class="bar ${sp>pl?'over':''}"><i style="width:${pct}%"></i>${tick!==null?`<b style="left:${tick}%" title="Today"></b>`:''}</div>
 <div class="mute">${R(pl)} planned${cur?` · day ${now.getDate()} of ${dim}, marker shows where you are in the month`:''}</div></div>`;
 if(Math.abs(un)>=0.005)h+=`<div class="note">${un>0?`${R(un)} of income has no job yet. Give it a category such as savings or debt.`:`You have planned ${R(-un)} more than you earn this month.`}<br><button class="sm" onclick="go('budget')">Adjust budget</button></div>`;
 const gs=groups();
 for(const g in gs){const cs=gs[g],gp=cs.reduce((a,c)=>a+plan(c),0),gs2=cs.reduce((a,c)=>a+spent(c.id),0);
  h+=`<h2>${esc(g)}<span>${R(gs2)} of ${R(gp)}</span></h2>`;
  cs.forEach(c=>{const p=plan(c),s=spent(c.id),o=s>p+0.005,w=p>0?Math.min(100,s/p*100):(s>0?100:0);
   h+=`<div class="row"><div class="top"><span>${esc(c.n)}</span><span class="${o?'over-t':''}">${R(s)} <span class="mute">/ ${R(p)}</span></span></div><div class="bar ${o?'over':''}"><i style="width:${w}%"></i></div></div>`})}
 const unk=txs().filter(t=>!S.cats.some(c=>c.id===t.c)).reduce((a,t)=>a+t.a,0);
 if(unk)h+=`<h2>Uncategorised<span>${R(unk)}</span></h2>`;
 return h}
function add(){
 let o='';const gs=groups();for(const g in gs)o+=`<optgroup label="${esc(g)}">${gs[g].map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</optgroup>`;
 const list=txs().sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i);
 return head()+`<label for="a">Amount (R)</label><input id="a" class="amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
 <label for="c">Category</label><select id="c">${o}</select>
 <div class="two"><div><label for="d">Date</label><input id="d" type="date" value="${today()}"></div><div><label for="n">Note</label><input id="n" placeholder="Optional"></div></div>
 <button class="btn" onclick="addTx()">Add spending</button>
 <h2>This month<span>${list.length} entries</span></h2>`+(list.length?list.map(t=>{const c=S.cats.find(c=>c.id===t.c);return`<div class="row"><div class="top"><span>${esc(c?c.n:'Removed category')}${t.n?` <span class="mute">${esc(t.n)}</span>`:''}</span><span>${R(t.a)}</span></div><div class="top"><span class="mute">${t.d}</span><button class="sm d" onclick="delTx(${t.i})">Delete</button></div></div>`}).join(''):`<div class="mute">No spending logged for ${label()}. Add your first entry above.</div>`)}
function addTx(){const a=parseFloat($('#a').value.replace(',','.'));if(!(a>0)){toast('Enter an amount above 0');return}
 S.tx.push({i:S.n++,a:Math.round(a*100)/100,c:$('#c').value,d:$('#d').value||today(),n:$('#n').value.trim()});save();
 if(!S.tx[S.tx.length-1].d.startsWith(M))M=S.tx[S.tx.length-1].d.slice(0,7);toast('Spending added');render()}
function delTx(i){if(confirm('Delete this entry?')){S.tx=S.tx.filter(t=>t.i!==i);save();render()}}
function budget(){
 const inc=income(),pl=S.cats.reduce((a,c)=>a+plan(c),0),un=inc-pl,gs=groups();
 let h=head()+`<label for="inc">Income for ${label()}</label><input id="inc" class="amt" inputmode="decimal" value="${inc}" onchange="setInc(this.value)">
 <div class="note" style="margin-top:14px;border-color:${Math.abs(un)<0.005?'var(--ok)':'var(--warn)'}">${Math.abs(un)<0.005?'Every rand has a job.':un>0?`${R(un)} unassigned.`:`Over-planned by ${R(-un)}.`} Planned ${R(pl)} of ${R(inc)}.</div>`;
 for(const g in gs){h+=`<h2>${esc(g)}</h2>`;gs[g].forEach(c=>{h+=`<div class="row edit"><span>${esc(c.n)}</span><input inputmode="decimal" value="${plan(c)}" aria-label="Planned amount for ${esc(c.n)}" onchange="setPlan('${c.id}',this.value)"><button class="sm d" aria-label="Remove ${esc(c.n)}" onclick="delCat('${c.id}')">✕</button></div>`})}
 const gl=Object.keys(gs);
 h+=`<h2>Add a category</h2><label for="nn">Name</label><input id="nn" placeholder="e.g. Emergency fund"><label for="ng">Group</label><select id="ng">${gl.map(g=>`<option>${esc(g)}</option>`).join('')}</select>
 <button class="btn ghost" onclick="addCat()">Add category</button>
 <button class="btn ghost" onclick="makeDefault()">Use this month's plan for new months</button>`;return h}
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return n>=0?n:0};
function setInc(v){S.inc[M]=num(v);save();render()}
function setPlan(id,v){(S.ov[M]=S.ov[M]||{})[id]=num(v);save();render()}
function addCat(){const n=$('#nn').value.trim();if(!n){toast('Enter a name');return}S.cats.push({id:'u'+S.n++,g:$('#ng').value,n,p:0});save();render()}
function delCat(id){if(confirm('Remove this category? Past spending stays logged.')){S.cats=S.cats.filter(c=>c.id!==id);save();render()}}
function makeDefault(){S.cats.forEach(c=>c.p=plan(c));S.income=income();save();toast('Saved as the default for new months')}
function more(){return`<header><h1>More</h1></header><h2>Your data</h2><div class="mute">Everything is stored on this phone only. Export a backup now and then.</div>
 <button class="btn" onclick="exp()">Export backup</button><button class="btn ghost" onclick="$('#f').click()">Import backup</button><input id="f" type="file" accept="application/json" hidden onchange="imp(this.files[0])">
 <button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" onclick="reset()">Erase everything</button>
 <h2>Install</h2><div class="mute">Android Chrome: menu, then Install app. iPhone Safari: Share, then Add to Home Screen.</div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='money-guide-backup-'+today()+'.json';a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.cats||!j.tx)throw 0;S=j;save();toast('Backup restored');render()}catch(e){toast('That file is not a Money Guide backup')}})}
function reset(){if(confirm('Erase all categories, budgets and spending on this phone?')){localStorage.removeItem(KEY);S=load();render()}}
function render(){
 $('#app').innerHTML=({home,add,budget,more})[tab]();
 $('#nav').innerHTML=[['home','Home'],['add','Add'],['budget','Budget'],['more','More']].map(([k,l])=>`<button onclick="go('${k}')" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('')}
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
